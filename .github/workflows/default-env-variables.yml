name: "Default Environment Variables"

on:
  workflow_dispatch:

jobs:

  env-job:
    runs-on: ubuntu-latest

    steps:

      - name: "Show envs"
        run: |
          echo "environment variables are"
          env

      - name: "Show home dir"
        run: echo "home directory is $HOME"
  
      - name: "Set env var"
        run: echo "VARRE=ich bin ein berliner" >> "$GITHUB_ENV"

      - name: "Get env var"
        run: echo "Here is VARRE. $VARRE"

      - name: "Set output"
        id: set_output
        run: echo "VARE=123" >> "$GITHUB_OUTPUT"

      - name: "Get output"
        env:
          YESS: ${{ steps.set_output.outputs.VARE }}
        run: echo "Here is YESS. $YESS"
