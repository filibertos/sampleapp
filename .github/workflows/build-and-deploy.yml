name: Build and Deploy

on:
  workflow_dispatch:

jobs:

  build-job:
    runs-on: windows-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup .net
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '8.x'

      - name: Build code
        run: dotnet build --configuration Release

      - name: Publish code
        run: dotnet publish --configuration Release --property:PublishDir="${{ env.DOTNET_ROOT }}\myapp"

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: .net-app
          path: ${{ env.DOTNET_ROOT }}\myapp

  deploy-job:
    runs-on: windows-latest
    needs: build-job
    env:
      package-name: .net-app
      app-name: azureapp

    steps:

      - name: Download artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ env.package-name }}

      - name: Echo app name
        run: echo "App will be deployed to ${{ env.app-name }}"

      - name: Echo app secret
        run: echo "Secret matches to ${{ secrets.AZURE_PUBLISH_PROFILE == 'Placeholder' }}"

      - name: List files in root directory
        run: |
          Get-ChildItem -Path . | ForEach-Object { Write-Output $_.Name }
        shell: pwsh
