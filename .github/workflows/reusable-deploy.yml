name: Reusable Deploy

on:
  workflow_call:
    inputs:
      package-name:
        required: true
        type: string
      app-name:
        required: true
        type: string
    secrets:
      azure-publish-profile:
        required: false

jobs:

  deploy-job:
    runs-on: windows-latest

    steps:

      - name: Download artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ inputs.package-name }}

      - name: Echo app name
        run: echo "App will be deployed to ${{ inputs.app-name }}"

      - name: Echo app secret
        run: echo "Secret matches to ${{ secrets.azure-publish-profile == 'Placeholder' }}"

      - name: List files in root directory
        run: |
          Get-ChildItem -Path . | ForEach-Object { Write-Output $_.Name }
        shell: pwsh